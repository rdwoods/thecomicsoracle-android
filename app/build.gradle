apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'realm-android'
apply plugin: 'kotlin-kapt'

android {
    compileSdkVersion 27
    buildToolsVersion '27.0.3'

    defaultConfig {
        applicationId "com.rwoods.thecomicsoracle"
        minSdkVersion 21
        targetSdkVersion 27
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix ".debug"
        }

        /**
         * The 'initWith' property allows you to copy configurations from other build types,
         * so you don't have to configure one from the beginning. You can then configure
         * just the settings you want to change. The following line initializes
         * 'jnidebug' using the debug build type, and changes only the
         * applicationIdSuffix and versionNameSuffix settings.
         */

        jnidebug {

            // This copies the debuggable attribute and debug signing configurations.
            initWith debug

            applicationIdSuffix ".jnidebug"
            jniDebuggable true
        }
    }

    flavorDimensions "mdpi", "hdpi"

    productFlavors {
        /*dev {
            buildConfigField("String", "ENV", '"https://comicvine.gamespot.com/api/"')
            buildConfigField("String", "API_KEY", '"310286c7441deb2eac2cc1aeae01393b69c99452"')
        }*/

        fullmdpi {
            dimension "mdpi"
            buildConfigField("String", "ENV", '"https://comicvine.gamespot.com/api/"')
            buildConfigField("String", "API_KEY", '"310286c7441deb2eac2cc1aeae01393b69c99452"')
            minSdkVersion 21
        }

        fullhdpi {
            dimension "hdpi"
            buildConfigField("String", "ENV", '"https://comicvine.gamespot.com/api/"')
            buildConfigField("String", "API_KEY", '"310286c7441deb2eac2cc1aeae01393b69c99452"')
            minSdkVersion 21
        }
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }

    packagingOptions {
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }
}

repositories {
    maven {
        url 'https://github.com/uPhyca/stetho-realm/raw/master/maven-repo'
    }
    mavenCentral()
}


dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    def lifecycle_version = "1.1.1"

    // Android Support dependencies
    compile 'com.android.support:multidex:1.0.3'
    compile 'com.android.support:appcompat-v7:27.1.1'
    compile 'com.android.support:design:27.1.1'
    compile 'com.android.support.constraint:constraint-layout:1.1.0'

    // Android LifeCycle
    implementation "android.arch.lifecycle:extensions:$lifecycle_version"

    // Square dependencies
    compile 'com.squareup.retrofit2:retrofit:2.3.0'
    compile 'com.squareup.retrofit2:retrofit-mock:2.0.1'
    compile 'com.squareup.okhttp3:okhttp-urlconnection:3.6.0'
    compile 'com.squareup.okhttp3:logging-interceptor:3.6.0'
    compile 'com.squareup.moshi:moshi:1.5.0'
    compile 'com.squareup.retrofit2:converter-moshi:2.3.0'
    compile 'com.squareup.moshi:moshi-kotlin:1.5.0'

    // Apache Collections Commons
    compile 'org.apache.commons:commons-lang3:3.4'
    compile 'org.apache.commons:commons-collections4:4.0'
    compile 'commons-codec:commons-codec:1.10'

    // Glide
    compile 'com.github.bumptech.glide:glide:3.7.0'

    // Rx Java
    compile 'io.reactivex:rxandroid:1.2.1'
    compile 'io.reactivex:rxjava:1.1.6'
    compile 'org.slf4j:slf4j-simple:1.7.13'

    // Stetho
    compile 'com.facebook.stetho:stetho:1.5.0'
    compile 'com.uphyca:stetho_realm:2.0.0'

    // Realm/Kotlin
    kapt "io.realm:realm-annotations:3.3.1"
    kapt "io.realm:realm-annotations-processor:3.3.1"

    // Butterknife
    compile 'com.jakewharton:butterknife:8.5.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:8.5.1'

    // JUnit
    testCompile 'junit:junit:4.12'
    testCompile "org.mockito:mockito-core:2.7.22"

    // Android JUnit Runner
    androidTestCompile 'com.android.support.test:runner:1.0.2'

    // JUnit4 Rules
    androidTestCompile 'com.android.support.test:rules:1.0.2'

    // Espresso core
    androidTestCompile ('com.android.support.test.espresso:espresso-core:2.2.2'){
        exclude module: 'support-annotations'
    }
    // Espresso-contrib for DatePicker, RecyclerView, Drawer actions, Accessibility checks, CountingIdlingResource
    androidTestCompile ('com.android.support.test.espresso:espresso-contrib:2.2.2'){
        exclude module: 'support-annotations'
        exclude module: 'support-v4'
        exclude module: 'support-v13'
        exclude module: 'design'
        exclude module: 'appcompat-v7'
        exclude module: 'recyclerview-v7'
    }

    androidTestCompile 'com.android.support:support-annotations:27.1.1'
    compile "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}
